<div class="card">
  <h2>Product Management</h2>
  <!-- <p-button label="Add Product" icon="pi pi-plus" class="mb-3" (click)="openNew()"></p-button> -->

  <p-table [value]="products" [paginator]="true" [rows]="5" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Price ($)</th>
        <!-- <th>Actions</th> -->
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.description }}</td>
        <td>{{ product.price }}</td>
        <!-- <td>
          <p-button icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
            (click)="editProduct(product)"></p-button>
          <p-button icon="pi pi-trash" class="p-button-rounded p-button-danger"
            (click)="deleteProduct(product)"></p-button>
        </td> -->
      </tr>
    </ng-template>
  </p-table>
</div>
